name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: interprete-windows
          path: target/release/interprete.exe

  e2e:
    name: e2e (audio real -> whisper -> traducción)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libssl-dev pkg-config espeak-ng
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/Interprete
          key: interprete-models-v1
      - name: Instalar motores y modelos
        run: ./target/release/interprete install
      - name: Generar frases de prueba
        run: |
          mkdir -p wav
          espeak-ng -v es -s 150 -w wav/es1.wav "Hola, buenos días. Hoy vamos a hablar de cómo funciona la energía solar."
          espeak-ng -v es -s 150 -w wav/es2.wav "Mañana tengo una reunión con el profesor para revisar el proyecto."
          espeak-ng -v en -s 150 -w wav/en1.wav "Good morning everyone. Today we will talk about how solar energy works."
          espeak-ng -v en -s 150 -w wav/en2.wav "Tomorrow I have a meeting with the professor to review the project."
      - name: Español a inglés
        run: ./target/release/interprete translate-file es en wav/es1.wav wav/es2.wav | tee es-en.txt
      - name: Inglés a español
        run: ./target/release/interprete translate-file en es wav/en1.wav wav/en2.wav | tee en-es.txt
      - name: Verificar resultados
        run: |
          set -e
          grep -qi "solar" es-en.txt
          grep -qi "meeting\|professor\|teacher" es-en.txt
          grep -qi "energía solar\|energia solar" en-es.txt
          grep -qi "reunión\|reunion" en-es.txt
          echo OK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-resultados
          path: |
            es-en.txt
            en-es.txt
