name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Interprete-windows-x64.zip
          - os: macos-latest
            asset: Interprete-macos-arm64.tar.gz
          - os: ubuntu-22.04
            asset: Interprete-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory Interprete | Out-Null
          Copy-Item target/release/interprete.exe Interprete/Interprete.exe
          Copy-Item README.md Interprete/LEEME.md
          Compress-Archive -Path Interprete -DestinationPath "${{ matrix.asset }}"
      - name: Empaquetar (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir Interprete
          cp target/release/interprete Interprete/Interprete
          cp README.md Interprete/LEEME.md
          tar -czf "${{ matrix.asset }}" Interprete
      - name: Subir al release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Intérprete $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
